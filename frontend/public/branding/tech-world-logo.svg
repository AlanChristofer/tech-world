<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 128" role="img" aria-labelledby="title description">
  <title id="title">Tech World — Developer Portfolio</title>
  <desc id="description">Marca Tech World com globo, órbita e avião.</desc>
  <defs>
    <radialGradient id="logo-planet" cx="36%" cy="28%" r="72%">
      <stop offset="0" stop-color="#31dff2"/>
      <stop offset=".4" stop-color="#087eb6"/>
      <stop offset="1" stop-color="#031b3c"/>
    </radialGradient>
    <linearGradient id="logo-orbit" x1="8" y1="92" x2="118" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55f6cf"/>
      <stop offset=".52" stop-color="#52e8ff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="270" y1="31" x2="505" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55f6cf"/>
      <stop offset=".52" stop-color="#52e8ff"/>
      <stop offset="1" stop-color="#4f8dff"/>
    </linearGradient>
    <clipPath id="logo-globe-clip">
      <circle cx="62" cy="66" r="35"/>
    </clipPath>
  </defs>

  <g>
    <circle cx="62" cy="66" r="36.5" fill="#031323" stroke="#8af7ff" stroke-width="2"/>
    <circle cx="62" cy="66" r="34" fill="url(#logo-planet)"/>
    <g clip-path="url(#logo-globe-clip)" fill="none" stroke="#bafaff" stroke-linecap="round">
      <path d="M27 66h70" stroke-width="1.8" opacity=".7"/>
      <path d="M31 50c18 7 44 7 62 0M31 82c18-7 44-7 62 0" stroke-width="1.5" opacity=".52"/>
      <path d="M62 31c-14 10-20 22-20 35s6 25 20 35M62 31c14 10 20 22 20 35s-6 25-20 35" stroke-width="1.7" opacity=".62"/>
    </g>
    <ellipse cx="62" cy="66" rx="56" ry="28" fill="none" stroke="#03111d" stroke-width="8" opacity=".72" transform="rotate(-18 62 66)"/>
    <ellipse cx="62" cy="66" rx="56" ry="28" fill="none" stroke="url(#logo-orbit)" stroke-width="4.8" stroke-linecap="round" transform="rotate(-18 62 66)"/>
    <g transform="translate(96 15) rotate(24)" fill="#f4ffff" stroke="#0a6f9c" stroke-width=".8" stroke-linejoin="round">
      <path d="M1 13.2 26 2.4c2.3-1 4.2 1.8 2.2 3.4L17.1 15l4.1 9.2-3.2 1.4-7.2-7.2-5.7 4.3-2.6-1.2 3.7-6.8L1 13.2Z"/>
    </g>
  </g>

  <text x="136" y="73" fill="#eaffff" stroke="#03111d" stroke-width="2.2" paint-order="stroke" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="850" letter-spacing="-2">
    <tspan>TECH</tspan><tspan fill="url(#wordmark)"> WORLD</tspan>
  </text>
  <line x1="138" y1="92" x2="181" y2="92" stroke="#55f6cf" stroke-width="2"/>
  <text x="194" y="98" fill="#9de9ed" stroke="#03111d" stroke-width="1" paint-order="stroke" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="7">DEVELOPER PORTFOLIO</text>
</svg>
