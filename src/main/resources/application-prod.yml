spring:
  config:
    activate:
      on-profile: prod
    import: optional:classpath:kafka-${KAFKA_SECURITY_PROTOCOL:SASL_SSL}.yml
  mongodb:
    uri: ${MONGODB_URI}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    admin:
      auto-create: false
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}

portfolio:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt-secret: ${JWT_SECRET}
    token-ttl: ${JWT_TOKEN_TTL:PT2H}
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
  seed:
    mode: bootstrap
  lab:
    kafka:
      topic: ${ORDER_CREATED_TOPIC:order-created}
    rate-limit:
      enabled: true
      max-requests: 5
      window: PT1M
