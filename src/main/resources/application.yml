spring:
  application:
    name: developer-command-center-api
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/developer_command_center}
server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
portfolio:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
    token-ttl: ${JWT_TOKEN_TTL:PT2H}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%level","logger":"%logger{36}","message":"%replace(%msg){''[\r\n]'','' ''}"}%n'
