spring:
  application:
    name: developer-command-center-api
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/developer_command_center}
    auto-index-creation: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: portfolio-java-engineering-lab
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
portfolio:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
    token-ttl: ${JWT_TOKEN_TTL:PT2H}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  lab:
    kafka:
      topic: ${ORDER_CREATED_TOPIC:order-created}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%level","logger":"%logger{36}","traceId":"%X{traceId:-}","orderId":"%X{orderId:-}","message":"%replace(%msg){''[\r\n]'','' ''}"}%n'
